global:
  scrape_interval: 15s
  evaluation_interval: 15s

# The multica-backend target assumes METRICS_ADDR uses port 9090 in
# docker-compose.obs.yml. If METRICS_ADDR changes, update backend:9090 below.

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: multica-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:9090

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: tempo
    metrics_path: /metrics
    static_configs:
      - targets:
          - tempo:3200
