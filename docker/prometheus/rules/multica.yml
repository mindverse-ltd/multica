groups:
  - name: multica
    rules:
      - alert: MulticaServiceDown
        expr: up{job="multica-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Multica backend is unreachable"
          description: "Prometheus has been unable to scrape the Multica backend metrics endpoint for more than 1 minute."

      - alert: MulticaHighErrorRate
        expr: |
          (
            sum(rate(multica_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(multica_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Multica backend 5xx error rate is above 5%"
          description: "More than 5% of backend HTTP requests have returned 5xx responses over the last 5 minutes."

      - alert: MulticaHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(multica_http_request_duration_seconds_bucket[5m]))
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Multica backend P95 latency is above 2 seconds"
          description: "The backend HTTP request P95 latency has been above 2 seconds for 5 minutes."

      - alert: MulticaDBPoolExhausted
        expr: |
          multica_db_pool_max_conns > 0
          and
          (multica_db_pool_acquired_conns / multica_db_pool_max_conns) > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Multica database pool usage is above 90%"
          description: "The backend has acquired more than 90% of configured PostgreSQL pool connections for 2 minutes."
