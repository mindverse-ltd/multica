worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format multica_timing '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for" '
                              'rt=$request_time '
                              'urt=$upstream_response_time '
                              'uct=$upstream_connect_time '
                              'h2=$http2';

    access_log /dev/stdout multica_timing;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 14000;
        server_name _;

        set $backend_upstream backend:8080;
        set $frontend_upstream frontend:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /auth/callback {
            proxy_pass http://$frontend_upstream$request_uri;
        }

        location /api/ {
            proxy_pass http://$backend_upstream$request_uri;
        }

        location /auth/ {
            proxy_pass http://$backend_upstream$request_uri;
        }

        location /uploads/ {
            proxy_pass http://$backend_upstream$request_uri;
        }

        location = /ws {
            proxy_read_timeout 86400;
            proxy_pass http://$backend_upstream$request_uri;
        }

        location /ws/ {
            proxy_read_timeout 86400;
            proxy_pass http://$backend_upstream$request_uri;
        }

        location / {
            proxy_pass http://$frontend_upstream$request_uri;
        }
    }
}
