global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by:
    - alertname
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # Placeholder receiver. Configure webhook/email/chat integration before
  # relying on Alertmanager for production notifications.
  - name: default
